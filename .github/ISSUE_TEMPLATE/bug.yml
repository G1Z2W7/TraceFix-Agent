name: Bug report
description: Report reproducible behavior that differs from a documented contract.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: State what happened and include the complete error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Link the contract, documentation, or test that defines the expected result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest commands and inputs that reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, operating system, runtime versions, and relevant configuration without secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach sanitized logs, traces, test output, or screenshots.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed credentials, personal data, and production Trace content.
          required: true
